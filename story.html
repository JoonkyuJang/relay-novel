<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>연문회 릴레이 소설</title>
  <script>
    // Old links (story.html?id=…) now live inside 연문회 OS.
    var id = new URLSearchParams(location.search).get('id');
    location.replace('./' + (id ? '#/story/' + encodeURIComponent(id) : ''));
  </script>
</head>
<body><a href="./">연문회 릴레이 소설로 가기</a></body>
</html>
